name: asu-build
run-name: asu-${{ inputs.request_hash }}

on:
  workflow_dispatch:
    inputs:
      request_hash: {description: 请求哈希, required: true}
      version:      {description: 版本, required: true, default: "24.10.6"}
      target:       {description: 目标平台, required: true, default: "x86/64"}
      profile:      {description: 设备 profile, required: true, default: "generic"}
      packages:     {description: 额外软件包, required: false, default: ""}
      defaults:     {description: uci-defaults 脚本, required: false, default: ""}
      rootfs_size_mb: {description: rootfs 分区大小(MB), required: false, default: ""}
      filesystem:   {description: 文件系统(ext4/jffs2), required: false, default: ""}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REL: asu-${{ inputs.request_hash }}
      RHASH: ${{ inputs.request_hash }}
      VERSION: ${{ inputs.version }}
      TARGET: ${{ inputs.target }}
      PROFILE: ${{ inputs.profile }}
      PACKAGES: ${{ inputs.packages }}
      DEFAULTS_USED: ${{ inputs.defaults }}
      ROOTFS_SIZE_MB: ${{ inputs.rootfs_size_mb }}
      FILESYSTEM: ${{ inputs.filesystem }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h /
      - name: 创建 Release（先置为 queued）
        run: |
          set -euo pipefail
          cat > /tmp/queued.json <<JSONEOF
          {"status":"queued","request_hash":"$RHASH","version":"$VERSION","target":"$TARGET","profile":"$PROFILE","packages":"$PACKAGES"}
          JSONEOF
          cat /tmp/queued.json; echo
          if gh release view "$REL" >/dev/null 2>&1; then
            echo Release 已存在，仅更新状态
            gh release edit "$REL" --notes-file /tmp/queued.json
          else
            gh release create "$REL" --title "ASU $VERSION $TARGET $PROFILE" --notes-file /tmp/queued.json --latest=false
          fi
          gh release view "$REL" --json tagName --jq .tagName

      - name: 安装 ImageBuilder 依赖（照 immortalwrt/asu 的 Containerfile.ib）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential ccache clang cpio curl file g++-multilib gawk gcc-multilib genisoimage gettext git libdw-dev libelf-dev libncurses-dev locales pv pwgen python3 python3-pip qemu-utils rsync signify-openbsd subversion sudo swig unzip wget zlib1g-dev zstd dosfstools mtools
          for t in qemu-img genisoimage mkfs.vfat mcopy gawk zstd; do printf '%-16s ' "$t"; command -v "$t" || echo 缺失; done


      - name: 记录开始时间
        run: echo "START=$(date +%s)" >> "$GITHUB_ENV"
      - name: 缓存 ImageBuilder 压缩包
        uses: actions/cache@v6
        with:
          path: ib.tar
          key: ib-${{ inputs.version }}-${{ inputs.target }}

      - name: 下载 ImageBuilder
        run: |
          set -euo pipefail
          V='${{ inputs.version }}'; T='${{ inputs.target }}'
          BASE="https://downloads.immortalwrt.org/releases/$V/targets/$T"
          if [ -s ib.tar ]; then echo 命中缓存; else
            curl -sSL --max-time 120 "$BASE/" -o index.html
            IB=$(grep -oE 'immortalwrt-imagebuilder-[^"<> ]+Linux-x86_64\.tar\.(xz|zst)' index.html | head -1)
            test -n "$IB"; echo "IB=$IB"
            curl -sSL --max-time 900 -o ib.tar "$BASE/$IB"
          fi
          ls -la ib.tar
          mkdir -p ib && tar -xf ib.tar -C ib --strip-components=1

      - name: 解析包清单（照官方先跑 make manifest）
        run: |
          set -euo pipefail
          cd ib
          make manifest PROFILE='${{ inputs.profile }}' PACKAGES='${{ inputs.packages }}' STRIP_ABI=1 > /tmp/manifest.txt 2>/tmp/manifest.err || {
            echo 'make manifest 失败'; tail -40 /tmp/manifest.err; exit 1; }
          echo "manifest 行数: $(wc -l < /tmp/manifest.txt)"
          head -3 /tmp/manifest.txt
          python3 - <<'PYMANIFEST'
          import hashlib
          txt = open('/tmp/manifest.txt').read()
          sep = ' - ' if ' - ' in txt else ' '
          m = {}
          for line in txt.splitlines():
              line = line.strip()
              if not line:
                  continue
              parts = line.split(sep, 1)
              if len(parts) == 2:
                  m[parts[0].strip()] = parts[1].strip()
          names = sorted(set(k.removeprefix('+') for k in m))
          h = hashlib.sha256(' '.join(names).encode('utf-8')).hexdigest()
          open('/tmp/pkg_hash.txt','w').write(h)
          print('包数量=%d  packages_hash=%s' % (len(names), h))
          print('EXTRA_IMAGE_NAME =', h[:12])
          PYMANIFEST
          echo "PKG_HASH=$(cat /tmp/pkg_hash.txt)" >> "$GITHUB_ENV"

      - name: x86 特判：关掉多余镜像格式
        if: startsWith(inputs.target, 'x86/')
        run: |
          set -euo pipefail
          cd ib
          sed -i -e 's|CONFIG_ISO_IMAGES=y|# CONFIG_ISO_IMAGES is not set|g' \
                 -e 's|CONFIG_QCOW2_IMAGES=y|# CONFIG_QCOW2_IMAGES is not set|g' \
                 -e 's|CONFIG_VDI_IMAGES=y|# CONFIG_VDI_IMAGES is not set|g' \
                 -e 's|CONFIG_VMDK_IMAGES=y|# CONFIG_VMDK_IMAGES is not set|g' \
                 -e 's|CONFIG_VHDX_IMAGES=y|# CONFIG_VHDX_IMAGES is not set|g' \
                 .config
          grep -E 'ISO_IMAGES|QCOW2_IMAGES|VDI_IMAGES|VMDK_IMAGES|VHDX_IMAGES' .config || true

      - name: 准备 uci-defaults（首次启动脚本）
        run: |
          set -euo pipefail
          D='${{ inputs.defaults }}'
          if [ -n "$D" ]; then
            mkdir -p ib/asu-files/etc/uci-defaults
            printf '%s\n' "$D" > ib/asu-files/etc/uci-defaults/99-asu-defaults
            chmod +x ib/asu-files/etc/uci-defaults/99-asu-defaults
            echo '已写入 uci-defaults:'
            head -5 ib/asu-files/etc/uci-defaults/99-asu-defaults
          else
            echo '未提供 defaults，跳过'
          fi

      - name: 构建镜像
        run: |
          set -euo pipefail
          cd ib
          EXTRA=''
          # 官方 build.py: ROOTFS_PARTSIZE / ROOTFS_FILESYSTEM
          ROOTFS_ARGS=''
          RS='${{ inputs.rootfs_size_mb }}'
          FS='${{ inputs.filesystem }}'
          [ -n "$RS" ] && ROOTFS_ARGS="$ROOTFS_ARGS ROOTFS_PARTSIZE=$RS"
          [ -n "$FS" ] && ROOTFS_ARGS="$ROOTFS_ARGS ROOTFS_FILESYSTEM=$FS"
          echo "ROOTFS_ARGS=$ROOTFS_ARGS"
          if [ -d asu-files ]; then EXTRA='FILES=asu-files'; fi
          PKGHASH="${PKG_HASH:0:12}"
          echo "EXTRA=$EXTRA  EXTRA_IMAGE_NAME=$PKGHASH"
          make image PROFILE='${{ inputs.profile }}' PACKAGES='${{ inputs.packages }}' EXTRA_IMAGE_NAME="$PKGHASH" $EXTRA $ROOTFS_ARGS -j"$(nproc)" 2>&1 | tee /tmp/build.log | tail -60

      - name: 收集产物
        run: |
          set -euo pipefail
          END=$(date +%s); ELAPSED=$((END-START)); echo "耗时 $ELAPSED 秒"; echo "ELAPSED=$ELAPSED" >> "$GITHUB_ENV"
          find ib/bin/targets -type f | head -40
          python3 - <<'PY' > /tmp/result.json
          import json, os, hashlib
          root='ib/bin/targets'; imgs=[]
          for dp,dn,fn in os.walk(root):
              for f in fn:
                  p=os.path.join(dp,f)
                  imgs.append({'name': os.path.relpath(p,root), 'size': os.path.getsize(p), 'sha256': hashlib.sha256(open(p,'rb').read()).hexdigest()})
          print(json.dumps({'images': imgs, 'count': len(imgs)}))
          PY
          head -c 300 /tmp/result.json; echo

      - name: 上传产物到 Release
        run: |
          set -euo pipefail
          cd ib/bin/targets
          find . -type f -exec gh release upload "$REL" {} --clobber \;
          cd "$GITHUB_WORKSPACE"
          gh release view "$REL" --json assets --jq '.assets[].name' | head -20

      - name: 更新状态为 complete
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/status.json
          import json, os
          imgs = json.load(open('/tmp/result.json'))['images']
          for i in imgs: i['asset'] = i['name'].split('/')[-1]
          print(json.dumps({'status':'complete','request_hash':os.environ.get('RHASH',''),
                            'version':os.environ.get('VERSION',''),
                  'target':os.environ.get('TARGET',''),
                  'profile':os.environ.get('PROFILE',''),
                  'packages':os.environ.get('PACKAGES',''),
                  'defaults_used':bool(os.environ.get('DEFAULTS_USED','')),
                  'rootfs_size_mb':os.environ.get('ROOTFS_SIZE_MB',''),
                  'filesystem':os.environ.get('FILESYSTEM',''),
                  'elapsed':os.environ.get('ELAPSED',''),
                            'images':imgs,'count':len(imgs)}, ensure_ascii=False))
          PY
          gh release edit "$REL" --notes-file /tmp/status.json
          gh release view "$REL" --json url --jq .url

      - name: 失败时写入 failed 状态
        if: failure() || cancelled()
        continue-on-error: true
        run: |
          tail -150 /tmp/build.log 2>/dev/null | head -c 2500 > /tmp/tail.txt || true
          python3 - <<'PY' > /tmp/failed.json
          import json, os
          log = ''
          try: log = open('/tmp/tail.txt', encoding='utf-8', errors='ignore').read()[:2500]
          except Exception: pass
          print(json.dumps({'status':'failed','request_hash':os.environ.get('RHASH',''),'version':os.environ.get('VERSION',''),'target':os.environ.get('TARGET',''),'profile':os.environ.get('PROFILE',''),'packages':os.environ.get('PACKAGES',''),'buildlog':log}, ensure_ascii=False))
          PY
          gh release edit "$REL" --notes-file /tmp/failed.json || true
